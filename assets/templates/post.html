<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.SiteName}} - {{.Post.Title}}</title>
    <link rel="icon" type="image/jpeg" href="/static/images/p.jpg">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/post.css">
</head>
<body>
    <!-- 整体布局：左侧导航 + 右侧内容 -->
    <div class="layout">
        {{template "_sidebar.html" .}}

        <!-- 右侧内容 -->
        <main class="main-content">
            <!-- 文章头部 -->
            <div class="post-header">
                <h1 class="post-title">{{.Post.Title}}</h1>
                <div class="post-meta">
                    <span>{{.Post.Date.Format "2006-01-02"}}</span>
                    <span>{{.Post.Author}}</span>
                </div>
            </div>

            <!-- 文章内容 -->
            <article class="post-content">
                {{.Post.HTML}}
            </article>

            <!-- 标签 -->
            {{if .Post.Tags}}
            <div class="post-tags">
                <div class="post-tags-title">标签:</div>
                {{range .Post.Tags}}
                <a href="/tag/{{.}}" class="tag">{{.}}</a>
                {{end}}
            </div>
            {{end}}

            <!-- 上下篇导航 -->
            <div class="post-nav">
                {{if .PrevPost}}
                <div class="prev-post">
                    <span class="label">上一篇</span>
                    <a href="/post/{{.PrevPost.Slug}}">{{.PrevPost.Title}}</a>
                </div>
                {{else}}
                <div></div>
                {{end}}

                {{if .NextPost}}
                <div class="next-post" style="text-align: right;">
                    <span class="label">下一篇</span>
                    <a href="/post/{{.NextPost.Slug}}">{{.NextPost.Title}}</a>
                </div>
                {{end}}
            </div>
        </main>
    </div>

</body>
</html>
