<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.SiteName}} - 标签列表</title>
    <link rel="icon" type="image/jpeg" href="/static/images/p.jpg">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/tags.css">
</head>
<body>
    <!-- 整体布局：左侧导航 + 右侧内容 -->
    <div class="layout">
        {{template "_sidebar.html" .}}

        <!-- 右侧内容 -->
        <main class="main-content">
            <!-- 页面头部 -->
            <div class="page-header">
                <h1>标签列表</h1>
                <p>共 {{len .Tags}} 个标签</p>
            </div>

            <!-- 标签列表 -->
            <div class="tags-container">
                {{range .Tags}}
                <a href="/tag/{{.}}" class="tag-item">{{.}}</a>
                {{end}}
            </div>
        </main>
    </div>

</body>
</html>
